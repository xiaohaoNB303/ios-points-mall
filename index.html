<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>积分商城 · 固定入口</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: #f2f2f7;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    color: #1c1c1e;
  }
  .card {
    width: 100%; max-width: 420px; background: #fff; border-radius: 20px;
    padding: 32px 26px 26px; box-shadow: 0 8px 30px rgba(0,0,0,.06); text-align: center;
  }
  .mark {
    width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 18px;
    background: linear-gradient(135deg, #0a84ff, #0060df);
    display: flex; align-items: center; justify-content: center;
  }
  .mark svg { width: 34px; height: 34px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-size: 22px; margin: 0 0 6px; font-weight: 700; letter-spacing: .5px; }
  .sub { font-size: 13px; color: #8e8e93; margin-bottom: 24px; }
  .status {
    font-size: 15px; font-weight: 600; padding: 14px 12px; border-radius: 12px;
    background: #f2f2f7; margin-bottom: 14px; line-height: 1.5;
  }
  .status.ok { background: #e8f7ed; color: #1a7f37; }
  .status.warn { background: #fff4e5; color: #9a5b00; }
  .url {
    font-size: 12px; color: #6d6d72; word-break: break-all; line-height: 1.6;
    background: #fafafa; border: 1px solid #ececec; border-radius: 10px;
    padding: 10px; margin-bottom: 16px; min-height: 20px;
  }
  button {
    width: 100%; border: 0; border-radius: 12px; padding: 14px; font-size: 16px;
    font-weight: 600; cursor: pointer; margin-top: 8px; font-family: inherit;
  }
  .primary { background: #0a84ff; color: #fff; }
  .primary:active { background: #0060df; }
  .ghost { background: #f2f2f7; color: #0a84ff; }
  .tip { font-size: 12px; color: #8e8e93; line-height: 1.7; margin-top: 20px; text-align: left; }
  .tip b { color: #3a3a3c; }
  .spin {
    display: inline-block; width: 15px; height: 15px; margin-right: 8px; vertical-align: -2px;
    border: 2px solid rgba(10,132,255,.25); border-top-color: #0a84ff; border-radius: 50%;
    animation: r .8s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="mark">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="19" cy="17" r="2.2"/></svg>
  </div>
  <h1>积分商城</h1>
  <div class="sub">固定入口 · 自动连接当前可用地址</div>

  <div class="status" id="status"><span class="spin"></span>正在获取商城最新地址…</div>
  <div class="url" id="url">—</div>

  <button class="primary" id="openBtn" hidden>立即打开商城</button>
  <button class="ghost" id="retryBtn" hidden>重新获取地址</button>

  <div class="tip">
    <b>这个网址永远不会变</b>，请收藏本页。底层接入地址会定期更新，本页会实时读取最新地址并带你过去，<b>不需要你手动换链接</b>。<br><br>
    若长时间连不上，说明服务正在重新连接，稍等一两分钟再刷新本页即可。
  </div>
</div>

<script>
  var ISSUE_API = "https://api.github.com/repos/xiaohaoNB303/ios-points-mall/issues/1";
  var URL_RE = /https:\/\/[a-z0-9-]+\.trycloudflare\.com/gi;
  var MAX_TRY = 8, TRY_GAP = 5000;
  var tries = 0, target = null, timer = null;

  var $status = document.getElementById("status");
  var $url = document.getElementById("url");
  var $open = document.getElementById("openBtn");
  var $retry = document.getElementById("retryBtn");

  function setStatus(text, cls) {
    $status.className = "status" + (cls ? " " + cls : "");
    $status.innerHTML = text;
  }

  async function fetchLatest() {
    var res = await fetch(ISSUE_API, { cache: "no-store", headers: { "Accept": "application/vnd.github+json" } });
    if (!res.ok) throw new Error("读取地址失败 HTTP " + res.status);
    var data = await res.json();
    var list = (data.body || "").match(URL_RE);
    if (!list || !list.length) throw new Error("暂未播报地址");
    return list[list.length - 1];
  }

  async function probe(url) {
    var ctrl = new AbortController();
    var to = setTimeout(function () { ctrl.abort(); }, 8000);
    try {
      await fetch(url + "/", { mode: "no-cors", signal: ctrl.signal, cache: "no-store" });
      clearTimeout(to);
      return true;
    } catch (e) {
      clearTimeout(to);
      return false;
    }
  }

  async function run() {
    clearTimeout(timer);
    $open.hidden = true; $retry.hidden = true;
    setStatus('<span class="spin"></span>正在获取商城最新地址…');
    try {
      target = await fetchLatest();
      $url.textContent = target;
      setStatus('<span class="spin"></span>正在连接商城…');
      var alive = await probe(target);
      if (alive) {
        setStatus("已连接，正在跳转…", "ok");
        location.replace(target);
        return;
      }
      throw new Error("通道正在重启");
    } catch (e) {
      tries++;
      if (tries < MAX_TRY) {
        setStatus("正在重新连接，" + TRY_GAP / 1000 + " 秒后自动重连（" + tries + "/" + MAX_TRY + "）", "warn");
        $open.hidden = false;
        $open.textContent = "手动打开（可能暂不可用）";
        timer = setTimeout(run, TRY_GAP);
      } else {
        setStatus("暂时连不上商城，请稍后刷新本页重试", "warn");
        $retry.hidden = false;
      }
    }
  }

  $open.onclick = function () {
    if (target) location.href = target;
  };
  $retry.onclick = function () { tries = 0; run(); };

  run();
</script>
</body>
</html>
