name: 积分商城 · 云端计时（Cloudflare 免登录临时隧道）

on:
  workflow_dispatch:
    inputs:
      relay_from:
        description: "被接力的上一棒 run id（自接力传入，用于零断线交接）"
        required: false
        default: ""
  push:
    branches: [master]
  schedule:
    - cron: '*/10 * * * *'    # 每 10 分钟兜底：若接力断裂，尽快重建

permissions:
  contents: write             # 用于把 data.json 持久化到 data 分支
  issues: write              # 用于把最新公网地址写到 Issue
  actions: write             # 用于临近超时时自接力（gh workflow run）

env:
  PORT: "8000"
  CODE_DIR: ${{ github.workspace }}
  REPO_URL: "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/xiaohaoNB303/ios-points-mall.git"
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  EMAIL_USER: ${{ secrets.EMAIL_USER }}
  EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
  SMTP_FROM: ${{ secrets.SMTP_FROM }}
  ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 354      # 单任务最长 ~6h；到点前自接力下一棒
    steps:
      # 【关键】防重复必须把结果写到 outputs，并让后续每个步骤都用 if 跳过。
      # 以前用 `exit 0` 只会结束当前 step，后续步骤照样跑 -> 每次 push/定时
      # 都会额外启动一个完整实例，多实例各写各的 data.json 互相覆盖 -> 丢数据。
      - name: 防重复（已有在线隧道则跳过整个实例；自接力除外）
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELAY="${{ github.event.inputs.relay_from }}"
          CURRENT="${GITHUB_RUN_ID}"
          if [ -n "$RELAY" ]; then
            echo "自接力触发（接棒自 run $RELAY），继续启动新隧道以实现零断线交接。"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CNT=$(gh run list --workflow tunnel.yml --json status,databaseId \
            -q --arg id "$CURRENT" \
            '[.[] | select((.status=="in_progress" or .status=="queued") and (.databaseId|tostring)!=$id)] | length' \
            || echo 1)
          if [ "$CNT" -gt 0 ]; then
            echo "已有 $CNT 个隧道在跑，本次跳过整个实例，避免重复域名与数据互相覆盖。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "无其它在线隧道，本次启动。"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 拉取代码
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: 设置 Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 恢复历史数据：只从 data 分支读取，绝不用空 JSON 覆盖已有数据。
      # 后续 keepalive.sh 的 restore_data 会再用 _rev 比较做一次兜底。
      - name: 载入持久化数据（data 分支）
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "bot@mall.local"
          git config user.name "mall-bot"
          git remote set-url origin "$REPO_URL"
          if git ls-remote --exit-code origin refs/heads/data; then
            git fetch origin "+refs/heads/data:refs/remotes/origin/data" 2>/dev/null \
              || git fetch origin data 2>/dev/null || true
            if git cat-file -e origin/data:data.json 2>/dev/null; then
              git show origin/data:data.json > data.json.tmp
              if python3 -c 'import json,sys; d=json.load(open("data.json.tmp",encoding="utf-8")); assert isinstance(d,dict)' 2>/dev/null; then
                mv data.json.tmp data.json
                echo "已从 data 分支恢复历史数据（$(wc -c < data.json) 字节）"
              else
                rm -f data.json.tmp
                echo "历史数据解析失败，保留现有数据文件（不写空数据）"
              fi
            else
              echo "data 分支暂无 data.json，由保活脚本初始化"
            fi
          else
            # 首次运行：创建 data 分支（空壳即可，真实数据由保活脚本写入）
            git checkout -q --orphan data
            git rm -rf --cached . >/dev/null 2>&1 || true
            echo '{"products":[],"users":{},"redeem_codes":[]}' > data.json
            git add -f data.json
            git commit -q -m "init persistent data"
            git push -q origin data
            git checkout -q -f master
            echo "首次运行：已创建 data 分支"
          fi

      - name: 启动积分商城
        if: steps.guard.outputs.skip != 'true'
        run: |
          nohup python3 server.py > server.log 2>&1 &
          sleep 3
          curl -fsS http://localhost:$PORT/ >/dev/null || { echo "商城启动失败"; cat server.log; exit 1; }
          echo "商城已就绪：http://localhost:$PORT"

      - name: 下载 cloudflared（免登录临时隧道，无需 Cloudflare 账号）
        if: steps.guard.outputs.skip != 'true'
        run: |
          curl -sSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared --version

      - name: 启动 Cloudflare 临时隧道并播报地址
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nohup ./cloudflared tunnel --url http://localhost:$PORT --logfile cf.log --loglevel info >/dev/null 2>&1 &
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-z0-9.-]+\.trycloudflare\.com' cf.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then echo "未能获取隧道地址"; cat cf.log; exit 1; fi
          echo "当前公网地址: $URL"
          bash report_url.sh "$URL"

      - name: 保活（守护进程 + 持久化 + 热更新 + 自接力）
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash keepalive.sh
