name: 积分商城 · 云端计时（Cloudflare 免登录临时隧道）

on:
  workflow_dispatch:          # 手动触发
  push:
    branches: [master]        # 推送 master 后自动起
  schedule:
    - cron: '*/10 * * * *'    # 每 10 分钟兜底：若接力断裂，尽快重建

permissions:
  contents: write             # 用于把 data.json 持久化到 data 分支
  issues: write              # 用于把最新公网地址写到 Issue
  actions: write             # 用于临近超时时自接力（gh workflow run）

concurrency:
  group: mall-tunnel
  cancel-in-progress: false  # 不取消进行中的任务，保证始终有一条隧道在线

env:
  PORT: "8000"
  REPO_URL: "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/xiaohaoNB303/ios-points-mall.git"
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  EMAIL_USER: ${{ secrets.EMAIL_USER }}
  EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
  SMTP_FROM: ${{ secrets.SMTP_FROM }}
  ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 354      # 单任务最长 ~6h；到点前自接力下一棒
    steps:
      - name: 防重复（已有在线隧道则跳过，避免重复域名）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CNT=$(gh run list --workflow tunnel.yml --json status -q '[.[] | select(.status=="in_progress" or .status=="queued")] | length' || echo 1)
          if [ "$CNT" -gt 1 ]; then
            echo "已有 $CNT 个任务在排队/运行中，本次跳过以避免重复隧道。"
            exit 0
          fi

      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 载入持久化数据（data 分支，没有则初始化）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "bot@mall.local"
          git config user.name "mall-bot"
          if git ls-remote --exit-code origin refs/heads/data; then
            git fetch origin data
            git show origin/data:data.json > data.json 2>/dev/null || true
          else
            echo '{"products":[],"users":{},"redeem_codes":[]}' > data.json
            git checkout --orphan data
            git rm -rf --cached . >/dev/null 2>&1 || true
            git add -f data.json
            git commit -q -m "init persistent data"
            git push -q origin data
            git checkout -q master
          fi
          [ -s data.json ] || echo '{"products":[],"users":{},"redeem_codes":[]}' > data.json
          echo "data.json 已就绪"

      - name: 启动积分商城
        run: |
          nohup python3 server.py > server.log 2>&1 &
          sleep 3
          curl -fsS http://localhost:$PORT/ >/dev/null || { echo "商城启动失败"; cat server.log; exit 1; }
          echo "商城已就绪：http://localhost:$PORT"

      - name: 下载 cloudflared（免登录临时隧道，无需 Cloudflare 账号）
        run: |
          curl -sSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared --version

      - name: 启动 Cloudflare 临时隧道并播报地址
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nohup ./cloudflared tunnel --url http://localhost:$PORT --logfile cf.log --loglevel info >/dev/null 2>&1 &
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-z0-9.-]+\.trycloudflare\.com' cf.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then echo "未能获取隧道地址"; cat cf.log; exit 1; fi
          echo "当前公网地址: $URL"
          bash report_url.sh "$URL"

      - name: 保活（守护进程 + 持久化 + 热更新 + 自接力）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash keepalive.sh
